<svg xmlns="http://www.w3.org/2000/svg" width="820" height="228" viewBox="0 0 820 228" role="img" aria-labelledby="bench-multiInstance-title bench-multiInstance-desc">
  <title id="bench-multiInstance-title">Micro-benchmark: Batch of short-lived instances</title>
  <desc id="bench-multiInstance-desc">Create + start 10 instances, send each one event, then stop them all. Batch of short-lived instances, batch of 10: yay-machine 870k lifecycles/s, XState 50.3k lifecycles/s; 17× faster.</desc>
  <style>svg:root{--bench-bg:#17171b;--bench-bg-top:#1f1f25;--bench-border:#2f2f37;--bench-grid:#2a2a31;--bench-axis:#5a5a66;--bench-text:#f4f4f5;--bench-muted:#a1a1aa;--bench-faint:#71717a;--bench-yay:#f2b632;--bench-yay-deep:#c98a06;--bench-accent:#f2b632;--bench-xstate:#8b95a7;--bench-xstate-deep:#5f6879;--bench-slower:#e0786b;--bench-even:#a1a1aa}@media (prefers-color-scheme:light){svg:root{--bench-bg:#ffffff;--bench-bg-top:#fafaf8;--bench-border:#e4e4e7;--bench-grid:#ececef;--bench-axis:#a1a1aa;--bench-text:#18181b;--bench-muted:#52525b;--bench-faint:#71717a;--bench-yay:#f2b632;--bench-yay-deep:#d99a0b;--bench-accent:#876600;--bench-xstate:#a3acbb;--bench-xstate-deep:#6b7588;--bench-slower:#c2410c;--bench-even:#71717a}}</style>
  <defs>
    <linearGradient id="bench-multiInstance-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--bench-bg-top)"/>
      <stop offset="1" style="stop-color:var(--bench-bg)"/>
    </linearGradient>
    <linearGradient id="bench-multiInstance-yay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--bench-yay-deep)"/>
      <stop offset="1" style="stop-color:var(--bench-yay)"/>
    </linearGradient>
    <linearGradient id="bench-multiInstance-xstate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--bench-xstate-deep)"/>
      <stop offset="1" style="stop-color:var(--bench-xstate)"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="819" height="227" rx="14" fill="url(#bench-multiInstance-card)" style="stroke:var(--bench-border)"/>
  <rect x="32" y="0.5" width="64" height="3" rx="1.5" fill="url(#bench-multiInstance-yay)"/>
  <text x="32" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="650" text-anchor="start" style="fill:var(--bench-text)">Micro-benchmark: Batch of short-lived instances</text>
  <text x="32" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">Create + start 10 instances, send each one event, then stop them all.</text>
  <rect x="602" y="30" width="12" height="12" rx="3" fill="url(#bench-multiInstance-yay)"/><text x="620" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">yay-machine</text><rect x="724" y="30" width="12" height="12" rx="3" fill="url(#bench-multiInstance-xstate)"/><text x="788" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="end" style="fill:var(--bench-muted)">XState</text>
  <text x="32" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" style="fill:var(--bench-text)">batch of 10</text><text x="32" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">1 op = 10 lifecycles</text><rect x="252" y="108" width="182.4" height="18" rx="5" fill-opacity="0.5" style="fill:var(--bench-grid)"/><rect x="252" y="108" width="182.4" height="18" rx="5" fill="url(#bench-multiInstance-yay)"/><text x="442.4" y="121.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">870k lifecycles/s ±1.5%</text><rect x="252" y="134" width="182.4" height="18" rx="5" fill-opacity="0.5" style="fill:var(--bench-grid)"/><rect x="252" y="134" width="10.5" height="18" rx="5" fill="url(#bench-multiInstance-xstate)"/><text x="270.5" y="147.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">50.3k lifecycles/s ±7.0%</text><rect x="624" y="114" width="164" height="30" rx="15" fill-opacity="0.12" stroke-opacity="0.55" style="fill:var(--bench-accent);stroke:var(--bench-accent)"/><text x="706" y="134" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" style="fill:var(--bench-accent)">17× faster</text>
  <line x1="32" y1="174" x2="788" y2="174" style="stroke:var(--bench-grid)"/>
  <text x="32" y="196" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" style="fill:var(--bench-faint)">yay-machine v1.5.0+297 (4179cf1)  ·  xstate 5.33.3  ·  Bun 1.4.3  ·  2026-11-09</text>
  <text x="32" y="211" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" style="fill:var(--bench-faint)">11th Gen Intel(R) Core(TM) i7-1185G7 @ 3.00GHz, 8 cores, 8 GB  ·  Linux (WSL2) (x64)</text>
</svg>
