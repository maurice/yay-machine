<svg xmlns="http://www.w3.org/2000/svg" width="820" height="318" viewBox="0 0 820 318" role="img" aria-labelledby="bench-complex-title bench-complex-desc">
  <title id="bench-complex-title">Workload: Login request</title>
  <desc id="bench-complex-desc">A short-lived, per-request login workflow: create + start, LOGIN through a guarded immediate transition, LOGOUT/RETRY, stop. Includes entry/exit effects and a session resource. Login request, login success + logout: yay-machine 271k requests/s, XState 18.9k requests/s; 14× faster. Login request, login rejected + retry: yay-machine 320k requests/s, XState 18.0k requests/s; 18× faster.</desc>
  <style>svg:root{--bench-bg:#17171b;--bench-bg-top:#1f1f25;--bench-border:#2f2f37;--bench-grid:#2a2a31;--bench-axis:#5a5a66;--bench-text:#f4f4f5;--bench-muted:#a1a1aa;--bench-faint:#71717a;--bench-yay:#f2b632;--bench-yay-deep:#c98a06;--bench-accent:#f2b632;--bench-xstate:#8b95a7;--bench-xstate-deep:#5f6879;--bench-slower:#e0786b;--bench-even:#a1a1aa}@media (prefers-color-scheme:light){svg:root{--bench-bg:#ffffff;--bench-bg-top:#fafaf8;--bench-border:#e4e4e7;--bench-grid:#ececef;--bench-axis:#a1a1aa;--bench-text:#18181b;--bench-muted:#52525b;--bench-faint:#71717a;--bench-yay:#f2b632;--bench-yay-deep:#d99a0b;--bench-accent:#876600;--bench-xstate:#a3acbb;--bench-xstate-deep:#6b7588;--bench-slower:#c2410c;--bench-even:#71717a}}</style>
  <defs>
    <linearGradient id="bench-complex-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--bench-bg-top)"/>
      <stop offset="1" style="stop-color:var(--bench-bg)"/>
    </linearGradient>
    <linearGradient id="bench-complex-yay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--bench-yay-deep)"/>
      <stop offset="1" style="stop-color:var(--bench-yay)"/>
    </linearGradient>
    <linearGradient id="bench-complex-xstate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--bench-xstate-deep)"/>
      <stop offset="1" style="stop-color:var(--bench-xstate)"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="819" height="317" rx="14" fill="url(#bench-complex-card)" style="stroke:var(--bench-border)"/>
  <rect x="32" y="0.5" width="64" height="3" rx="1.5" fill="url(#bench-complex-yay)"/>
  <text x="32" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="650" text-anchor="start" style="fill:var(--bench-text)">Workload: Login request</text>
  <text x="32" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">A short-lived, per-request login workflow: create + start, LOGIN through a guarded immediate transition,</text>
  <text x="32" y="86" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">LOGOUT/RETRY, stop. Includes entry/exit effects and a session resource.</text>
  <rect x="602" y="30" width="12" height="12" rx="3" fill="url(#bench-complex-yay)"/><text x="620" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">yay-machine</text><rect x="724" y="30" width="12" height="12" rx="3" fill="url(#bench-complex-xstate)"/><text x="788" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="end" style="fill:var(--bench-muted)">XState</text>
  <text x="32" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" style="fill:var(--bench-text)">login success + logout</text><text x="32" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">1 op = 1 request (create, 2</text><text x="32" y="170" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">events, stop)</text><rect x="252" y="126" width="189.3" height="18" rx="5" fill-opacity="0.5" style="fill:var(--bench-grid)"/><rect x="252" y="126" width="160.6" height="18" rx="5" fill="url(#bench-complex-yay)"/><text x="420.6" y="139.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">271k requests/s ±9.0%</text><rect x="252" y="152" width="189.3" height="18" rx="5" fill-opacity="0.5" style="fill:var(--bench-grid)"/><rect x="252" y="152" width="11.2" height="18" rx="5" fill="url(#bench-complex-xstate)"/><text x="271.2" y="165.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">18.9k requests/s ±10.2%</text><rect x="624" y="132" width="164" height="30" rx="15" fill-opacity="0.12" stroke-opacity="0.55" style="fill:var(--bench-accent);stroke:var(--bench-accent)"/><text x="706" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" style="fill:var(--bench-accent)">14× faster</text><line x1="32" y1="184" x2="788" y2="184" stroke-dasharray="2 4" style="stroke:var(--bench-grid)"/><text x="32" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" style="fill:var(--bench-text)">login rejected + retry</text><text x="32" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">1 op = 1 request (create, 2</text><text x="32" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">events, stop)</text><rect x="252" y="198" width="189.3" height="18" rx="5" fill-opacity="0.5" style="fill:var(--bench-grid)"/><rect x="252" y="198" width="189.3" height="18" rx="5" fill="url(#bench-complex-yay)"/><text x="449.3" y="211.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">320k requests/s ±4.9%</text><rect x="252" y="224" width="189.3" height="18" rx="5" fill-opacity="0.5" style="fill:var(--bench-grid)"/><rect x="252" y="224" width="10.7" height="18" rx="5" fill="url(#bench-complex-xstate)"/><text x="270.7" y="237.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">18.0k requests/s ±10.6%</text><rect x="624" y="204" width="164" height="30" rx="15" fill-opacity="0.12" stroke-opacity="0.55" style="fill:var(--bench-accent);stroke:var(--bench-accent)"/><text x="706" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" style="fill:var(--bench-accent)">18× faster</text>
  <line x1="32" y1="264" x2="788" y2="264" style="stroke:var(--bench-grid)"/>
  <text x="32" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" style="fill:var(--bench-faint)">yay-machine v1.5.0+297 (4179cf1)  ·  xstate 5.33.3  ·  Bun 1.4.3  ·  2026-11-09</text>
  <text x="32" y="301" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" style="fill:var(--bench-faint)">11th Gen Intel(R) Core(TM) i7-1185G7 @ 3.00GHz, 8 cores, 8 GB  ·  Linux (WSL2) (x64)</text>
</svg>
