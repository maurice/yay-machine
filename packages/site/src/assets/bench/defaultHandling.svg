<svg xmlns="http://www.w3.org/2000/svg" width="820" height="392" viewBox="0 0 820 392" role="img" aria-labelledby="bench-defaultHandling-title bench-defaultHandling-desc">
  <title id="bench-defaultHandling-title">Micro-benchmark: Event resolution</title>
  <desc id="bench-defaultHandling-desc">An event handled by the current state, falling through to a machine-level handler, or not handled at all. Event resolution, handled by current state: yay-machine 2.00M events/s, XState 249k events/s; 8.0× faster. Event resolution, falls through to machine-level: yay-machine 2.05M events/s, XState 221k events/s; 9.3× faster. Event resolution, not handled (ignored): yay-machine 28.5M events/s, XState 670k events/s; 43× faster.</desc>
  <style>svg:root{--bench-bg:#17171b;--bench-bg-top:#1f1f25;--bench-border:#2f2f37;--bench-grid:#2a2a31;--bench-axis:#5a5a66;--bench-text:#f4f4f5;--bench-muted:#a1a1aa;--bench-faint:#71717a;--bench-yay:#f2b632;--bench-yay-deep:#c98a06;--bench-accent:#f2b632;--bench-xstate:#8b95a7;--bench-xstate-deep:#5f6879;--bench-slower:#e0786b;--bench-even:#a1a1aa}@media (prefers-color-scheme:light){svg:root{--bench-bg:#ffffff;--bench-bg-top:#fafaf8;--bench-border:#e4e4e7;--bench-grid:#ececef;--bench-axis:#a1a1aa;--bench-text:#18181b;--bench-muted:#52525b;--bench-faint:#71717a;--bench-yay:#f2b632;--bench-yay-deep:#d99a0b;--bench-accent:#876600;--bench-xstate:#a3acbb;--bench-xstate-deep:#6b7588;--bench-slower:#c2410c;--bench-even:#71717a}}</style>
  <defs>
