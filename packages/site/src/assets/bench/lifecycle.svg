  <text x="32" y="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" style="fill:var(--bench-faint)">yay-machine v1.5.0+296 (3df96b7*)  ·  xstate 5.33.3  ·  Bun 1.4.3  ·  2026-11-08</text>
