<svg xmlns="http://www.w3.org/2000/svg" width="820" height="318" viewBox="0 0 820 318" role="img" aria-labelledby="bench-always-title bench-always-desc">
  <title id="bench-always-title">Micro-benchmark: Immediate transitions</title>
  <desc id="bench-always-desc">An event enters a transient decision state which immediately routes onwards via guarded 'always' transitions, then RESET. Immediate transitions, routes via 1st branch: yay-machine 1.61M events/s, XState 91.0k events/s; 18× faster. Immediate transitions, routes via last branch: yay-machine 1.27M events/s, XState 89.3k events/s; 14× faster.</desc>
  <style>svg:root{--bench-bg:#17171b;--bench-bg-top:#1f1f25;--bench-border:#2f2f37;--bench-grid:#2a2a31;--bench-axis:#5a5a66;--bench-text:#f4f4f5;--bench-muted:#a1a1aa;--bench-faint:#71717a;--bench-yay:#f2b632;--bench-yay-deep:#c98a06;--bench-accent:#f2b632;--bench-xstate:#8b95a7;--bench-xstate-deep:#5f6879;--bench-slower:#e0786b;--bench-even:#a1a1aa}@media (prefers-color-scheme:light){svg:root{--bench-bg:#ffffff;--bench-bg-top:#fafaf8;--bench-border:#e4e4e7;--bench-grid:#ececef;--bench-axis:#a1a1aa;--bench-text:#18181b;--bench-muted:#52525b;--bench-faint:#71717a;--bench-yay:#f2b632;--bench-yay-deep:#d99a0b;--bench-accent:#876600;--bench-xstate:#a3acbb;--bench-xstate-deep:#6b7588;--bench-slower:#c2410c;--bench-even:#71717a}}</style>
  <defs>
    <linearGradient id="bench-always-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--bench-bg-top)"/>
      <stop offset="1" style="stop-color:var(--bench-bg)"/>
    </linearGradient>
    <linearGradient id="bench-always-yay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--bench-yay-deep)"/>
      <stop offset="1" style="stop-color:var(--bench-yay)"/>
    </linearGradient>
    <linearGradient id="bench-always-xstate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--bench-xstate-deep)"/>
      <stop offset="1" style="stop-color:var(--bench-xstate)"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="819" height="317" rx="14" fill="url(#bench-always-card)" style="stroke:var(--bench-border)"/>
  <rect x="32" y="0.5" width="64" height="3" rx="1.5" fill="url(#bench-always-yay)"/>
  <text x="32" y="44" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="650" text-anchor="start" style="fill:var(--bench-text)">Micro-benchmark: Immediate transitions</text>
  <text x="32" y="68" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">An event enters a transient decision state which immediately routes onwards via guarded 'always'</text>
  <text x="32" y="86" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">transitions, then RESET.</text>
  <rect x="602" y="30" width="12" height="12" rx="3" fill="url(#bench-always-yay)"/><text x="620" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">yay-machine</text><rect x="724" y="30" width="12" height="12" rx="3" fill="url(#bench-always-xstate)"/><text x="788" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="end" style="fill:var(--bench-muted)">XState</text>
  <text x="32" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" style="fill:var(--bench-text)">routes via 1st branch</text><text x="32" y="156" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">1 op = 2 events</text><rect x="252" y="126" width="210" height="18" rx="5" fill-opacity="0.5" style="fill:var(--bench-grid)"/><rect x="252" y="126" width="210" height="18" rx="5" fill="url(#bench-always-yay)"/><text x="470" y="139.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">1.61M events/s ±6.2%</text><rect x="252" y="152" width="210" height="18" rx="5" fill-opacity="0.5" style="fill:var(--bench-grid)"/><rect x="252" y="152" width="11.9" height="18" rx="5" fill="url(#bench-always-xstate)"/><text x="271.9" y="165.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">91.0k events/s ±9.6%</text><rect x="624" y="132" width="164" height="30" rx="15" fill-opacity="0.12" stroke-opacity="0.55" style="fill:var(--bench-accent);stroke:var(--bench-accent)"/><text x="706" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" style="fill:var(--bench-accent)">18× faster</text><line x1="32" y1="184" x2="788" y2="184" stroke-dasharray="2 4" style="stroke:var(--bench-grid)"/><text x="32" y="212" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" style="fill:var(--bench-text)">routes via last branch</text><text x="32" y="228" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">1 op = 2 events</text><rect x="252" y="198" width="210" height="18" rx="5" fill-opacity="0.5" style="fill:var(--bench-grid)"/><rect x="252" y="198" width="166" height="18" rx="5" fill="url(#bench-always-yay)"/><text x="426" y="211.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">1.27M events/s ±8.9%</text><rect x="252" y="224" width="210" height="18" rx="5" fill-opacity="0.5" style="fill:var(--bench-grid)"/><rect x="252" y="224" width="11.7" height="18" rx="5" fill="url(#bench-always-xstate)"/><text x="271.7" y="237.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start" style="fill:var(--bench-muted)">89.3k events/s ±9.2%</text><rect x="624" y="204" width="164" height="30" rx="15" fill-opacity="0.12" stroke-opacity="0.55" style="fill:var(--bench-accent);stroke:var(--bench-accent)"/><text x="706" y="224" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" style="fill:var(--bench-accent)">14× faster</text>
  <line x1="32" y1="264" x2="788" y2="264" style="stroke:var(--bench-grid)"/>
  <text x="32" y="286" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" style="fill:var(--bench-faint)">yay-machine v1.5.0+297 (4179cf1)  ·  xstate 5.33.3  ·  Bun 1.4.3  ·  2026-11-09</text>
  <text x="32" y="301" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" style="fill:var(--bench-faint)">11th Gen Intel(R) Core(TM) i7-1185G7 @ 3.00GHz, 8 cores, 8 GB  ·  Linux (WSL2) (x64)</text>
</svg>
