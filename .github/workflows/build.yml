name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    environment:
      name: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check pushed commit
        if: github.event_name == 'push'
        run: bunx --bun commitlint --last --verbose

      - name: Check PR commits
        if: github.event_name == 'pull_request'
        run: bunx --bun commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Build
        run: bun run build

      - name: Check types
        run: bun run check:types

      - name: Check lint
        run: bun run check:lint

      - name: Test
        run: bun run test:ci

      - name: Coveralls
        uses: coverallsapp/github-action@v2

      - name: Validate MSW worker is up-to-date
        run: |
          (cd packages/site && bunx --bun msw init)
          bunx oxfmt --write packages/site/public/mockServiceWorker.js
          if ! git diff --quiet packages/site/public/mockServiceWorker.js; then
            echo "::error::mockServiceWorker.js is out of date with the installed msw version. Run '(cd packages/site && bunx --bun msw init) && bunx oxfmt --write packages/site/public/mockServiceWorker.js' and commit the result."
            git diff packages/site/public/mockServiceWorker.js
            exit 1
          fi

      - name: Check docs
        run: |
          bun run docs:sync
          git diff --exit-code
